asyncapi: 3.0.0
info:
  title: Anamorfa real-time protocol
  version: "0.1"
  description: |
    Real-time channel between an Anamorfa client and the authoritative server.
    Create a session with POST /sessions, then open /play?token=<token>.
    Reconnect with /play?token=<token>&since=<last seq seen>. See docs/session.md.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  local:
    host: localhost:8080
    protocol: ws
    description: Local development server
channels:
  play:
    address: /play
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
operations:
  sendAction:
    action: send
    channel:
      $ref: '#/channels/play'
    messages:
      - $ref: '#/channels/play/messages/clientMessage'
  receiveServerMessages:
    action: receive
    channel:
      $ref: '#/channels/play'
    messages:
      - $ref: '#/channels/play/messages/serverMessage'
components:
  messages:
    ClientMessage:
      name: ClientMessage
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: './schemas/v0/client-message.schema.json'
    ServerMessage:
      name: ServerMessage
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: './schemas/v0/server-message.schema.json'
