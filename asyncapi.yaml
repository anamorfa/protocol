asyncapi: 3.0.0
info:
  title: Anamorfa real-time protocol
  version: "0.5.0"
  description: |
    Real-time channel between an Anamorfa client and the authoritative server.
    Sign in (OpenID Connect, Authorization Code + PKCE), create a session with POST /sessions and
    the access token as Bearer, then open /play?token=<token>. Send reauth with each fresh access
    token before the current one expires.
    Reconnect with /play?token=<token>&since=<last seq seen>. While the Scribe walks, the server
    also sends one event message per step, without request_id. See docs/session.md.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  local:
    host: localhost:8080
    protocol: ws
    description: Local development server
channels:
  play:
    address: /play
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      reauthMessage:
        $ref: '#/components/messages/Reauth'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
operations:
  sendAction:
    action: send
    channel:
      $ref: '#/channels/play'
    messages:
      - $ref: '#/channels/play/messages/clientMessage'
  sendReauth:
    action: send
    channel:
      $ref: '#/channels/play'
    messages:
      - $ref: '#/channels/play/messages/reauthMessage'
  receiveServerMessages:
    action: receive
    channel:
      $ref: '#/channels/play'
    messages:
      - $ref: '#/channels/play/messages/serverMessage'
components:
  messages:
    ClientMessage:
      name: ClientMessage
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: './schemas/v0/client-message.schema.json'
    Reauth:
      name: Reauth
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: './schemas/v0/client-message.schema.json#/$defs/reauth'
    ServerMessage:
      name: ServerMessage
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: './schemas/v0/server-message.schema.json'
